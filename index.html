<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR của tôi</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 30px 15px;
        }

        .box {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 20px;
        }

        #qr {
            width: 300px;
            height: 300px;
            margin-top: 15px;
        }

        .content {
            font-size: 20px;
            line-height: 1.6;
            margin: 25px 0;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: black;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>MÃ QR CỦA TÔI</h1>

    <!-- NỘI DUNG SẼ HIỆN KHI QUÉT QR -->
    <div class="content">
        Xin chào! ❤️
        <br>
        Đây là nội dung của tôi.
    </div>

    <h2>Quét mã QR</h2>

    <!-- MÃ QR -->
    <img id="qr" alt="Mã QR">

    <br>

    <button onclick="downloadQR()">
        Lưu mã QR
    </button>

</div>

<script>

    // ==================================
    // LINK CỐ ĐỊNH
    // ==================================

    const linkQR =
        "https://hoangchangmy1-code.github.io/My-qr/";


    // ==================================
    // TẠO QR
    // ==================================

    const qrURL =
        "https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=20&data="
        + encodeURIComponent(linkQR);

    document.getElementById("qr").src = qrURL;


    // ==================================
    // LƯU ẢNH QR
    // ==================================

    function downloadQR() {

        const link = document.createElement("a");

        link.href = qrURL;

        link.download = "ma-qr-cua-toi.png";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);
    }

</script>

</body>
</html>
