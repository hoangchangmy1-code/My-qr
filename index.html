<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR của tôi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        .main-image {
            width: 100%;
            border-radius: 15px;
            margin: 15px 0;
        }

        .button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            background: #1877f2;
            color: white;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
        }

        .qr-box {
            margin-top: 30px;
            padding: 20px;
            background: #fafafa;
            border-radius: 15px;
        }

        .qr-box img {
            width: 250px;
            max-width: 100%;
        }

        .download {
            background: #222;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- TIÊU ĐỀ -->
        <h1>Ảnh của tôi</h1>

        <!-- NỘI DUNG -->
        <p>
            Đây là nội dung được mở khi mọi người quét mã QR.
        </p>

        <!-- ẢNH -->
        <img
            class="main-image"
            src="https://picsum.photos/800/500"
            alt="Ảnh của tôi"
        >

        <!-- LINK -->
        <a
            class="button"
            href="https://www.facebook.com/"
            target="_blank"
        >
            Mở Facebook
        </a>

        <!-- QR -->
        <div class="qr-box">

            <h2>Mã QR của tôi</h2>

            <img
                id="qrImage"
                src=""
                alt="QR Code"
            >

            <button
                class="button download"
                onclick="downloadQR()"
            >
                Tải ảnh QR
            </button>

        </div>

    </div>

</div>


<script>

    /*
        ================================
        LINK CỐ ĐỊNH CỦA QR
        ================================
        
        SAU KHI ĐƯA WEBSITE LÊN GITHUB,
        THAY LINK BÊN DƯỚI BẰNG LINK CỦA BẠN.
    */

    const fixedLink =
        "https://TEN-GITHUB-CUA-BAN.github.io/my-qr/";


    /*
        TẠO QR
    */

    const qrURL =
        "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data="
        + encodeURIComponent(fixedLink);

    document.getElementById("qrImage").src = qrURL;


    /*
        TẢI QR VỀ
    */

    function downloadQR() {

        const link = document.createElement("a");

        link.href = qrURL;

        link.download = "QR-code.png";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);
    }

</script>

</body>
</html>
