<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR của tôi</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 30px 15px;
        }

        .box {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 20px;
        }

        #qr {
            width: 300px;
            max-width: 100%;
            margin-top: 15px;
        }

        .content {
            font-size: 20px;
            line-height: 1.6;
            margin: 25px 0;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>MÃ QR CỦA TÔI</h1>

    <div class="content">
        Xin chào! ❤️
        <br>
        Đây là nội dung của tôi.
    </div>

    <h2>Quét mã QR</h2>

    <img id="qr" alt="Mã QR">

</div>

<script>
    const linkQR =
        "https://hoangchangmy1-code.github.io/My-qr/";

    const qrURL =
        "https://api.qrserver.com/v1/create-qr-code/?size=600x600&data="
        + encodeURIComponent(linkQR);

    document.getElementById("qr").src = qrURL;
</script>

</body>
</html>
